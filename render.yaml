services:
  - type: web
    name: agentic-voice-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: AGENTIC_API_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: DASHBOARD_MERCHANT_ID
        value: dashboard
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
