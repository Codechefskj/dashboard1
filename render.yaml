databases:
  - name: agentic-voice-dashboard-db
    plan: free

services:
  - type: web
    name: agentic-voice-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: AGENTIC_API_URL
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      # Leave DASHBOARD_TOKEN unset/empty so the dashboard opens without a password.
      - key: OPEN_ACCESS
        value: "true"
      - key: DASHBOARD_MERCHANT_ID
        value: dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-voice-dashboard-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: INVENTORY_SCAN_INTERVAL_MS
        value: "86400000"